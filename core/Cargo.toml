[package]
name = "cursor_core"
version = "0.1.0"
edition = "2021"
description = "Pure parsing core shared by the Windows and macOS shells."
publish = false

[lib]
name = "cursor_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
base64 = "0.22"
serde_json = "1"
sha2 = "0.10"
