[tool.ruff]
# 只拦真正的错误（语法、未定义名、未用导入之外的可疑写法），
# 不引入与现有长行风格冲突的格式规则。
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008"]  # FastAPI 的 Depends() 默认值依赖注入

[tool.ruff.lint.per-file-ignores]
# 测试先改 sys.path 再导入 app，E402 是刻意的。
"tests/test_api.py" = ["E402"]
