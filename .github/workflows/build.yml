# GitHub Actions：夹具测试 + Windows .NET / macOS Swift 打包
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep main/tag publishes running to completion so the rolling latest
  # release is not left with a stale description after a rapid second merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      build: ${{ steps.read.outputs.build }}
    steps:
    - uses: actions/checkout@v7
    - id: read
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version="$(tr -d '[:space:]' < VERSION)"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid VERSION: ${version}" >&2
          exit 1
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "tag=v${version}" >> "$GITHUB_OUTPUT"
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION v${version}" >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Official ${GITHUB_REF_NAME} already exists; skip tag rebuild"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        echo "build=true" >> "$GITHUB_OUTPUT"

  test:
    name: Test (Server, Rust & Packaging)
    needs: [version]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - name: Install server deps (locked)
      run: python -m pip install -r server/requirements.lock
    - name: Check requirements lock is up to date
      run: |
        python -m pip install --quiet uv
        uv pip compile server/requirements.txt --no-header --no-annotate --quiet -o /tmp/requirements.lock
        diff -u server/requirements.lock /tmp/requirements.lock
    - name: Lint server with ruff
      run: |
        python -m pip install --quiet ruff
        ruff check server
    - name: Run packaging and version tests
      run: python -m unittest tests.test_windows_packaging tests.test_version -v
    - name: Run sync server tests
      working-directory: server
      run: PYTHONPATH=. python -m unittest tests.test_api -v
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Run Rust core tests
      run: cargo test --manifest-path core/Cargo.toml
    - name: Lint Rust core with clippy
      run: cargo clippy --manifest-path core/Cargo.toml --all-targets -- -D warnings

  build-server-image:
    name: Build server image
    needs: [version]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Docker build
      run: docker build -t cursor-sync:${{ github.sha }} ./server

  # Swift tests run inside build-macos. A separate macOS test job needed a
  # second hosted macOS runner, and hosted macOS capacity is scarce: the test
  # job would grab a runner, then Build macOS timed out waiting for one
  # ("job was not acquired by Runner of type hosted") and the rolling `latest`
  # kept serving the stale .app. One macOS job, one runner, always ships.

  cleanup-artifacts:
    name: Cleanup artifacts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          # 并发 run（例如同时推 main 和 tag）会删除同一批 artifact，
          # 已删掉的再删会 404，不能让 set -e 把整个 job 判失败。
          for _ in $(seq 1 50); do
            mapfile -t ids < <(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | select(.name == \"CursorRemain-windows\" or .name == \"CursorRemain-macos\" or .name == \"CursorTokenTray-windows\" or .name == \"CursorTokenTray-macos\") | .id")
            if [ "${#ids[@]}" -eq 0 ] || [ -z "${ids[0]:-}" ]; then
              break
            fi
            for id in "${ids[@]}"; do
              [ -z "$id" ] && continue
              if gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null 2>&1; then
                deleted=$((deleted + 1))
              else
                echo "artifact ${id} already deleted by another run"
              fi
            done
          done
          echo "Deleted ${deleted} old artifacts (Actions storage quota)."

  build-windows:
    name: Build Windows
    needs: [version]
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust core
        run: cargo build --release --manifest-path core/Cargo.toml
      - name: Test C# core against Rust
        run: dotnet test windows/CursorTokenCore.Tests/CursorTokenCore.Tests.csproj -c Release --verbosity normal
      - name: Publish self-contained exe
        shell: pwsh
        run: |
          dotnet publish windows/CursorRemain/CursorRemain.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:InvariantGlobalization=true -p:DebugType=none -p:DebugSymbols=false -p:SourceRevisionId=$env:GITHUB_SHA -o dist-win
      - name: Report exe size
        shell: pwsh
        run: |
          Get-ChildItem dist-win | ForEach-Object { '{0} {1:N2} MB' -f $_.Name, ($_.Length / 1MB) }
          $exe = Get-Item dist-win\CursorRemain.exe
          if ($exe.Length -lt 20MB) {
            throw ("self-contained exe is unexpectedly small: {0:N2} MB" -f ($exe.Length/1MB))
          }
          if ($exe.Length -gt 120MB) {
            throw ("self-contained exe is unexpectedly large: {0:N2} MB" -f ($exe.Length/1MB))
          }
      - name: Zip onefile
        shell: pwsh
        run: |
          Copy-Item -Force windows\packaging\首次运行.txt dist-win\首次运行.txt
          Compress-Archive -Path dist-win\CursorRemain.exe, dist-win\首次运行.txt -DestinationPath CursorRemain-windows.zip -Force
          '{0} {1:N2} MB' -f 'CursorRemain-windows.zip', ((Get-Item CursorRemain-windows.zip).Length / 1MB)
      - name: Publish framework-dependent light exe
        shell: pwsh
        run: |
          dotnet publish windows/CursorRemain/CursorRemain.csproj -c Release -r win-x64 --self-contained false -p:SelfContained=false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false -p:PublishTrimmed=false -p:InvariantGlobalization=true -p:DebugType=none -p:DebugSymbols=false -p:SourceRevisionId=$env:GITHUB_SHA -o dist-win-light
      - name: Report light exe size
        shell: pwsh
        run: |
          Get-ChildItem dist-win-light | ForEach-Object { '{0} {1:N2} MB' -f $_.Name, ($_.Length / 1MB) }
          $exe = Get-Item dist-win-light\CursorRemain.exe
          $full = Get-Item dist-win\CursorRemain.exe
          if ($exe.Length -lt 200KB) {
            throw ("light exe is unexpectedly small: {0:N2} MB" -f ($exe.Length/1MB))
          }
          if ($exe.Length -gt 25MB) {
            throw ("light exe is unexpectedly large: {0:N2} MB" -f ($exe.Length/1MB))
          }
          if ($exe.Length -ge $full.Length) {
            throw "light exe must be smaller than the self-contained exe"
          }
      - name: Zip light package
        shell: pwsh
        run: |
          Compress-Archive -Path dist-win-light\CursorRemain.exe -DestinationPath CursorRemain-windows-light.zip -Force
          '{0} {1:N2} MB' -f 'CursorRemain-windows-light.zip', ((Get-Item CursorRemain-windows-light.zip).Length / 1MB)
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./windows/packaging/build_installer.ps1 -PublishDir dist-win -OutputDir . -SourceRevisionId $env:GITHUB_SHA -AppVersion "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: CursorRemain-windows
          path: |
            CursorRemain-windows.zip
            CursorRemain-windows-light.zip
            CursorRemain-windows-setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: Publish latest build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
          files: |
            CursorRemain-windows.zip
            CursorRemain-windows-light.zip
            CursorRemain-windows-setup.exe
      - name: Publish official v* release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/publish-official-release.sh CursorRemain-windows.zip CursorRemain-windows-light.zip CursorRemain-windows-setup.exe
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            CursorRemain-windows.zip
            CursorRemain-windows-light.zip
            CursorRemain-windows-setup.exe
          generate_release_notes: true
          make_latest: true

  # Swift tests run here so the whole macOS pipeline needs one hosted runner.
  # Only this job rewrites the rolling `latest` notes. Windows uploads its
  # zips without moving that SHA, so a skipped macOS build cannot advertise a
  # commit whose CursorRemain-macos.zip is still the previous one.
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [version]
    if: needs.version.outputs.build == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Swift tests
        run: |
          cargo build --release --manifest-path core/Cargo.toml
          swift test --package-path macos
      - name: Package .app
        run: |
          chmod +x macos/scripts/package_app.sh macos/scripts/normalize_linkage.sh
          SOURCE_REVISION="${GITHUB_SHA}" ./macos/scripts/package_app.sh
      - name: Verify packaged app is portable
        run: |
          set -euo pipefail
          bin=macos/dist/CursorRemain.app/Contents/MacOS/CursorRemain
          otool -L "$bin"
          if otool -L "$bin" | awk '/libcursor_core\.dylib/ && $1 !~ /^@/ {print; found=1} END {exit !found}'; then
            echo "error: packaged app still resolves libcursor_core from an absolute path" >&2
            exit 1
          fi
          codesign --verify --deep --strict macos/dist/CursorRemain.app
      - name: Zip .app
        run: |
          ditto -c -k macos/dist/release CursorRemain-macos.zip
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: CursorRemain-macos
          path: |
            CursorRemain-macos.zip
          if-no-files-found: error
          retention-days: 1
      - name: Publish latest build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
          files: |
            CursorRemain-macos.zip
          body: |
            滚动 `main` 预发布（`${{ github.sha }}`），随每次合入覆盖更新。正式版见最新 v* Release。
            Windows 安装版与 zip 为自包含包，无需另装 .NET；macOS 为 Swift `.app`。
      - name: Refresh latest release notes and tag
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/update-latest-release.sh
      - name: Publish official v* release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/publish-official-release.sh CursorRemain-macos.zip
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            CursorRemain-macos.zip
          generate_release_notes: true
          make_latest: true
