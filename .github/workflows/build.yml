# GitHub Actions：夹具测试 + Windows .NET / macOS Swift 打包
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep main/tag publishes running to completion so the rolling latest
  # release is not left with a stale description after a rapid second merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (Python + .NET)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install test deps
      run: python -m pip install -r requirements.txt -r server/requirements.txt
    - name: Run Python fixture tests
      run: python -m unittest tests.test_fixtures tests.test_cursor_api tests.test_accounts tests.test_account_sync tests.test_cloud_sync tests.test_windows_packaging -v
    - name: Run sync server tests
      working-directory: server
      run: PYTHONPATH=. python -m unittest tests.test_api -v
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"
    - name: Run C# core tests
      run: dotnet test windows/CursorTokenCore.Tests/CursorTokenCore.Tests.csproj -c Release --verbosity normal

  build-server-image:
    name: Build server image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Docker build
      run: docker build -t cursor-sync:${{ github.sha }} ./server

  test-macos:
    name: Test (Swift)
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Swift tests
      run: swift test --package-path macos
    - name: Compile menu bar app
      run: swift build --package-path macos --product CursorRemain -c release

  cleanup-artifacts:
    name: Cleanup artifacts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          while :; do
            mapfile -t ids < <(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | select(.name == \"CursorRemain-windows\" or .name == \"CursorRemain-macos\" or .name == \"CursorTokenTray-windows\" or .name == \"CursorTokenTray-macos\") | .id")
            if [ "${#ids[@]}" -eq 0 ] || [ -z "${ids[0]:-}" ]; then
              break
            fi
            for id in "${ids[@]}"; do
              [ -z "$id" ] && continue
              gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null
              deleted=$((deleted + 1))
            done
          done
          echo "Deleted ${deleted} old artifacts (Actions storage quota)."

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish framework-dependent exe
        shell: pwsh
        run: |
          dotnet publish windows/CursorRemain/CursorRemain.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:PublishTrimmed=false -p:InvariantGlobalization=true -p:DebugType=none -p:DebugSymbols=false -p:SourceRevisionId=$env:GITHUB_SHA -o dist-win-files
          echo "---- largest published files ----"
          Get-ChildItem dist-win-files -File | Sort-Object Length -Descending | Select-Object -First 15 | ForEach-Object { '{0,8:N2} MB  {1}' -f ($_.Length/1MB), $_.Name }
          $runtime = Get-ChildItem dist-win-files -File | Where-Object { $_.Name -match '^(coreclr|hostfxr|hostpolicy|System\.Private\.CoreLib)\.' }
          if ($runtime) {
            throw ("self-contained runtime leaked into publish: " + ($runtime.Name -join ', '))
          }
          dotnet publish windows/CursorRemain/CursorRemain.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false -p:PublishTrimmed=false -p:InvariantGlobalization=true -p:DebugType=none -p:DebugSymbols=false -p:SourceRevisionId=$env:GITHUB_SHA -o dist-win
      - name: Report exe size
        shell: pwsh
        run: |
          Get-ChildItem dist-win | ForEach-Object { '{0} {1:N2} MB' -f $_.Name, ($_.Length / 1MB) }
          $exe = Get-Item dist-win\CursorRemain.exe
          if ($exe.Length -gt 15MB) {
            throw ("framework-dependent exe is unexpectedly large: {0:N2} MB" -f ($exe.Length/1MB))
          }
      - name: Zip onefile
        shell: pwsh
        run: |
          Copy-Item -Force windows\packaging\首次运行.txt dist-win\首次运行.txt
          Compress-Archive -Path dist-win\CursorRemain.exe, dist-win\首次运行.txt -DestinationPath CursorRemain-windows.zip -Force
          Copy-Item -Force dist-win\CursorRemain.exe dist-win\CursorTokenTray.exe
          Compress-Archive -Path dist-win\CursorTokenTray.exe, dist-win\首次运行.txt -DestinationPath CursorTokenTray-windows.zip -Force
          '{0} {1:N2} MB' -f 'CursorRemain-windows.zip', ((Get-Item CursorRemain-windows.zip).Length / 1MB)
      - name: Build Windows installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./windows/packaging/build_installer.ps1 -PublishDir dist-win -OutputDir . -SourceRevisionId $env:GITHUB_SHA
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: CursorRemain-windows
          path: |
            CursorRemain-windows.zip
            CursorRemain-windows-setup.exe
            CursorTokenTray-windows.zip
          if-no-files-found: error
          retention-days: 1
      - name: Publish latest build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
          files: |
            CursorRemain-windows.zip
            CursorRemain-windows-setup.exe
            CursorTokenTray-windows.zip
          body: |
            最新 `main` 构建（`${{ github.sha }}`），随每次合入覆盖更新。
            Windows 提供安装版 `CursorRemain-windows-setup.exe` 与 zip 便携包（均为 .NET 8 框架依赖，需本机 Desktop Runtime），macOS 为 Swift `.app`。
            程序已更名为 CursorRemain；旧版自动更新仍可下载 CursorTokenTray-*.zip。
            从浏览器下载的 macOS 包若提示「已损坏」，请双击 zip 内的「首次打开.command」，或执行 `xattr -cr CursorRemain.app`。
            正式版请打 `v*` 标签。
      - name: Refresh latest release notes and tag
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/update-latest-release.sh
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            CursorRemain-windows.zip
            CursorRemain-windows-setup.exe
            CursorTokenTray-windows.zip
          generate_release_notes: true

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [test, test-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Package .app
        run: |
          chmod +x macos/scripts/package_app.sh
          SOURCE_REVISION="${GITHUB_SHA}" ./macos/scripts/package_app.sh
      - name: Zip .app
        run: |
          ditto -c -k macos/dist/release CursorRemain-macos.zip
          mkdir -p macos/dist/legacy-release
          cp -R macos/dist/release/CursorRemain.app macos/dist/legacy-release/CursorTokenTray.app
          cp macos/dist/release/首次打开.command macos/dist/legacy-release/首次打开.command
          ditto -c -k macos/dist/legacy-release CursorTokenTray-macos.zip
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: CursorRemain-macos
          path: |
            CursorRemain-macos.zip
            CursorTokenTray-macos.zip
          if-no-files-found: error
          retention-days: 1
      - name: Publish latest build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
          files: |
            CursorRemain-macos.zip
            CursorTokenTray-macos.zip
          body: |
            最新 `main` 构建（`${{ github.sha }}`），随每次合入覆盖更新。
            Windows 提供安装版 `CursorRemain-windows-setup.exe` 与 zip 便携包（均为 .NET 8 框架依赖，需本机 Desktop Runtime），macOS 为 Swift `.app`。
            程序已更名为 CursorRemain；旧版自动更新仍可下载 CursorTokenTray-*.zip。
            从浏览器下载的 macOS 包若提示「已损坏」，请双击 zip 内的「首次打开.command」，或执行 `xattr -cr CursorRemain.app`。
            正式版请打 `v*` 标签。
      - name: Refresh latest release notes and tag
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/update-latest-release.sh
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            CursorRemain-macos.zip
            CursorTokenTray-macos.zip
          generate_release_notes: true
