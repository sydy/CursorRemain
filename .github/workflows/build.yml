# GitHub Actions：夹具测试 + Windows .NET / macOS Swift 打包
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep main/tag publishes running to completion so the rolling latest
  # release is not left with a stale description after a rapid second merge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      build: ${{ steps.read.outputs.build }}
    steps:
    - uses: actions/checkout@v7
    - id: read
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        version="$(tr -d '[:space:]' < VERSION)"
        if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "Invalid VERSION: ${version}" >&2
          exit 1
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "tag=v${version}" >> "$GITHUB_OUTPUT"
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION v${version}" >&2
            exit 1
          fi
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Official ${GITHUB_REF_NAME} already exists; skip tag rebuild"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi
        echo "build=true" >> "$GITHUB_OUTPUT"

  test:
    name: Test (Python + .NET)
    needs: [version]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - name: Install test deps
      run: python -m pip install -r requirements.txt -r server/requirements.txt
    - name: Run Python fixture tests
      run: python -m unittest tests.test_fixtures tests.test_cursor_api tests.test_accounts tests.test_account_sync tests.test_cloud_sync tests.test_windows_packaging tests.test_version -v
    - name: Run sync server tests
      working-directory: server
      run: PYTHONPATH=. python -m unittest tests.test_api -v
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: "8.0.x"
    - name: Run C# core tests
      run: dotnet test windows/CursorTokenCore.Tests/CursorTokenCore.Tests.csproj -c Release --verbosity normal

  build-server-image:
    name: Build server image
    needs: [version]
    if: needs.version.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Docker build
      run: docker build -t cursor-sync:${{ github.sha }} ./server

  test-macos:
    name: Test (Swift)
    needs: [version]
    if: needs.version.outputs.build == 'true'
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
    - name: Swift tests
      run: swift test --package-path macos
    - name: Compile menu bar app
      run: swift build --package-path macos --product CursorRemain -c release

  cleanup-artifacts:
    name: Cleanup artifacts
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete old Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          deleted=0
          while :; do
            mapfile -t ids < <(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | select(.name == \"CursorRemain-windows\" or .name == \"CursorRemain-macos\" or .name == \"CursorTokenTray-windows\" or .name == \"CursorTokenTray-macos\") | .id")
            if [ "${#ids[@]}" -eq 0 ] || [ -z "${ids[0]:-}" ]; then
              break
            fi
            for id in "${ids[@]}"; do
              [ -z "$id" ] && continue
              gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null
              deleted=$((deleted + 1))
            done
          done
          echo "Deleted ${deleted} old artifacts (Actions storage quota)."

  build-windows:
    name: Build Windows
    needs: [version]
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish self-contained exe
        shell: pwsh
        run: |
          dotnet publish windows/CursorRemain/CursorRemain.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:InvariantGlobalization=true -p:DebugType=none -p:DebugSymbols=false -p:SourceRevisionId=$env:GITHUB_SHA -o dist-win
      - name: Report exe size
        shell: pwsh
        run: |
          Get-ChildItem dist-win | ForEach-Object { '{0} {1:N2} MB' -f $_.Name, ($_.Length / 1MB) }
          $exe = Get-Item dist-win\CursorRemain.exe
          if ($exe.Length -lt 20MB) {
            throw ("self-contained exe is unexpectedly small: {0:N2} MB" -f ($exe.Length/1MB))
          }
          if ($exe.Length -gt 120MB) {
            throw ("self-contained exe is unexpectedly large: {0:N2} MB" -f ($exe.Length/1MB))
          }
      - name: Zip onefile
        shell: pwsh
        run: |
          Copy-Item -Force windows\packaging\首次运行.txt dist-win\首次运行.txt
          Compress-Archive -Path dist-win\CursorRemain.exe, dist-win\首次运行.txt -DestinationPath CursorRemain-windows.zip -Force
          '{0} {1:N2} MB' -f 'CursorRemain-windows.zip', ((Get-Item CursorRemain-windows.zip).Length / 1MB)
      - name: Publish framework-dependent light exe
        shell: pwsh
        run: |
          dotnet publish windows/CursorRemain/CursorRemain.csproj -c Release -r win-x64 --self-contained false -p:SelfContained=false -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=false -p:PublishTrimmed=false -p:InvariantGlobalization=true -p:DebugType=none -p:DebugSymbols=false -p:SourceRevisionId=$env:GITHUB_SHA -o dist-win-light
      - name: Report light exe size
        shell: pwsh
        run: |
          Get-ChildItem dist-win-light | ForEach-Object { '{0} {1:N2} MB' -f $_.Name, ($_.Length / 1MB) }
          $exe = Get-Item dist-win-light\CursorRemain.exe
          $full = Get-Item dist-win\CursorRemain.exe
          if ($exe.Length -lt 200KB) {
            throw ("light exe is unexpectedly small: {0:N2} MB" -f ($exe.Length/1MB))
          }
          if ($exe.Length -gt 25MB) {
            throw ("light exe is unexpectedly large: {0:N2} MB" -f ($exe.Length/1MB))
          }
          if ($exe.Length -ge $full.Length) {
            throw "light exe must be smaller than the self-contained exe"
          }
      - name: Zip light package
        shell: pwsh
        run: |
          Compress-Archive -Path dist-win-light\CursorRemain.exe -DestinationPath CursorRemain-windows-light.zip -Force
          '{0} {1:N2} MB' -f 'CursorRemain-windows-light.zip', ((Get-Item CursorRemain-windows-light.zip).Length / 1MB)
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File ./windows/packaging/build_installer.ps1 -PublishDir dist-win -OutputDir . -SourceRevisionId $env:GITHUB_SHA -AppVersion "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: CursorRemain-windows
          path: |
            CursorRemain-windows.zip
            CursorRemain-windows-light.zip
            CursorRemain-windows-setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: Publish latest build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
          files: |
            CursorRemain-windows.zip
            CursorRemain-windows-light.zip
            CursorRemain-windows-setup.exe
          body: |
            滚动 `main` 预发布（`${{ github.sha }}`），随每次合入覆盖更新。正式版见最新 v* Release。
            Windows 安装版与 zip 为自包含包，无需另装 .NET；自动更新在本机已有 .NET 8 Desktop Runtime 时会改下不含运行时的轻量包。macOS 为 Swift `.app`。
      - name: Refresh latest release notes and tag
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/update-latest-release.sh
      - name: Publish official v* release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/publish-official-release.sh CursorRemain-windows.zip CursorRemain-windows-light.zip CursorRemain-windows-setup.exe
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            CursorRemain-windows.zip
            CursorRemain-windows-light.zip
            CursorRemain-windows-setup.exe
          generate_release_notes: true
          make_latest: true

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    needs: [version, test, test-macos]
    if: needs.version.outputs.build == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Package .app
        run: |
          chmod +x macos/scripts/package_app.sh
          SOURCE_REVISION="${GITHUB_SHA}" ./macos/scripts/package_app.sh
      - name: Zip .app
        run: |
          ditto -c -k macos/dist/release CursorRemain-macos.zip
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          name: CursorRemain-macos
          path: |
            CursorRemain-macos.zip
          if-no-files-found: error
          retention-days: 1
      - name: Publish latest build
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: Latest
          prerelease: true
          make_latest: false
          overwrite_files: true
          fail_on_unmatched_files: true
          target_commitish: ${{ github.sha }}
          files: |
            CursorRemain-macos.zip
          body: |
            滚动 `main` 预发布（`${{ github.sha }}`），随每次合入覆盖更新。正式版见最新 v* Release。
            Windows 安装版与 zip 为自包含包，无需另装 .NET；macOS 为 Swift `.app`。
      - name: Refresh latest release notes and tag
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/update-latest-release.sh
      - name: Publish official v* release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash .github/scripts/publish-official-release.sh CursorRemain-macos.zip
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            CursorRemain-macos.zip
          generate_release_notes: true
          make_latest: true
